<div class="d-flex justify-content-center">
    <p-dialog maskStyleClass="backdrop-blur-xs" [(visible)]="visible" styleClass="border-0 bg-transparent">

        <ng-template #headless>
            <form [formGroup]="loginForm">

                <div class="d-flex flex-column px-5 py-5 gap-3 rounded-3" style="
                        border-radius: 12px;
                        background-image: radial-gradient(
                            circle at left top,
                            var(--p-primary-400),
                            var(--p-primary-700)
                        );
                    ">

                    <div class="d-flex flex-column gap-2">
                        <label for="username" class="text-white fw-semibold small">
                            Username
                        </label>

                        <input formControlName="username" pInputText id="username"
                            class="bg-white bg-opacity-25 border-0 p-3 text-white w-100" style="max-width: 320px;" />
                    </div>

                    <div class="d-flex flex-column gap-2">
                        <label for="password" class="text-white fw-semibold small">
                            Password
                        </label>

                        <input formControlName="password" pInputText id="password" type="password"
                            class="bg-white bg-opacity-25 border-0 p-3 text-white w-100" style="max-width: 320px;" />
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <button type="button" pButton (click)="login()" [text]="true"
                            class="p-3 w-100 text-white border border-white border-opacity-25">
                            Sign-In
                        </button>
                    </div>

                </div>

            </form>
        </ng-template>

    </p-dialog>
</div>
